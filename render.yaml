services:
  - type: web
    name: pixi-bot
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MC_HOST
        value: piximc.aternos.me
      - key: MC_PORT
        value: "43180"
      - key: MC_USERNAME
        value: pixi
      - key: NODE_ENV
        value: production
